[project]
name = "vision-agent-mcp"
version = "0.1.0"
description = "Vision Agent MCP Server - 提供图像检测、分割、OCR等视觉工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0,<3",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.scripts]
vision-agent-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
